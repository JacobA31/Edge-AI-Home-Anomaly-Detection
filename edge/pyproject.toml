[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e3-edge"
version = "0.1.0"
description = "E3 code that runs on the Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "requests>=2.32",
]

[project.optional-dependencies]
# Installed on the Pi only (audio + model runtime). Not needed for CI tests.
pi = [
    "numpy",
    "sounddevice",
    "ai-edge-litert",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
